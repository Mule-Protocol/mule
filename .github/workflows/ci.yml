name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      extended-fuzz:
        description: Run the longer randomized weekly fuzz campaign
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install pnpm
        run: npm install --global pnpm@10.18.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target/debug
            target/release
            target/sbf-solana-solana
          key: mule-anchor0322-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'programs/*/Cargo.toml', 'programs/*/src/*.rs') }}
          restore-keys: mule-anchor0322-
      - name: Install pinned Anchor and Solana build tools
        shell: bash
        env:
          # Official release assets; provenance and checksum update procedure:
          # docs/testing/BUILD-TOOLS.md
          ANCHOR_SHA256: b3cdc15f3db924c2b11a7c16ceff21ad3da239ddde4e53f33df18e52e0461645
          SOLANA_SHA256: 56241fbe862495ff01b2b875195e44f94c22e9f2a504591a3ade1b9d82862730
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/mule-build-tools"
          mkdir -p "$tools_dir/bin"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/otter-sec/anchor/releases/download/v0.32.2/anchor-0.32.2-x86_64-unknown-linux-gnu \
            --output "$tools_dir/anchor"
          printf '%s  %s\n' "$ANCHOR_SHA256" "$tools_dir/anchor" | sha256sum --check --strict
          install -m 755 "$tools_dir/anchor" "$tools_dir/bin/anchor"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/anza-xyz/agave/releases/download/v2.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$tools_dir/solana-release.tar.bz2"
          printf '%s  %s\n' "$SOLANA_SHA256" "$tools_dir/solana-release.tar.bz2" | sha256sum --check --strict
          tar --extract --bzip2 --file "$tools_dir/solana-release.tar.bz2" --directory "$tools_dir"
          echo "$tools_dir/bin" >> "$GITHUB_PATH"
          echo "$tools_dir/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build Anchor program and IDL (no deployment)
        id: build
        run: |
          cargo fmt --all
          anchor --version
          solana --version
          anchor build --no-idl -- --tools-version v1.56
          mkdir -p target/idl
          anchor idl build --out target/idl/mule_escrow.json
          diff -u idl/mule_escrow.json target/idl/mule_escrow.json
      - name: Rust format and clippy
        run: |
          cargo fmt --all
          git diff --exit-code -- '*.rs'
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Package build, types, lint and tests
        if: success() || steps.build.outcome == 'success'
        run: |
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Anchor tests on the compiled SBF in LiteSVM
        if: success() || steps.build.outcome == 'success'
        run: anchor test --skip-build --skip-deploy --skip-local-validator
      - name: Instruction coverage
        if: success() || failure()
        run: pnpm coverage:instructions
      - name: Public evidence
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-step1-evidence
          path: |
            coverage/
            target/idl/mule_escrow.json
            target/deploy/mule_escrow.so
            Cargo.lock
            programs/mule_escrow/src/lib.rs
          if-no-files-found: warn
      - name: Cache compiler work without wallets
        if: (success() || failure()) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target/debug
            target/release
            target/sbf-solana-solana
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  local-missions:
    if: ${{ !inputs.extended-fuzz }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MULE_REUSE_VERIFIED_BUILD: '1'
      MULE_RPC_URL: http://127.0.0.1:8899
      MULE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@10.18.3
          pnpm install --frozen-lockfile
      - name: Reuse the verified program build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: m1-step1-evidence
          path: .
      - name: Install checksum-verified Agave 2.3.0
        shell: bash
        env:
          SOLANA_SHA256: 56241fbe862495ff01b2b875195e44f94c22e9f2a504591a3ade1b9d82862730
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/mule-local-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/anza-xyz/agave/releases/download/v2.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$tools_dir/solana-release.tar.bz2"
          printf '%s  %s\n' "$SOLANA_SHA256" "$tools_dir/solana-release.tar.bz2" | sha256sum --check --strict
          tar --extract --bzip2 --file "$tools_dir/solana-release.tar.bz2" --directory "$tools_dir"
          echo "$tools_dir/solana-release/bin" >> "$GITHUB_PATH"
      - name: Ten missions on a disposable local network
        run: pnpm local:missions
      - name: Public local-network evidence only
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-local-missions-evidence
          path: |
            runs/local-*.md
            runs/local-*.json
            data/*.json
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install the locked workspace
        run: |
          npm install --global pnpm@10.18.3
          pnpm install --frozen-lockfile
      - name: Install checksum-verified cargo-audit 0.22.2
        shell: bash
        env:
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/mule-audit-tools"
          mkdir -p "$tools_dir/bin"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$tools_dir/cargo-audit.tgz"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$tools_dir/cargo-audit.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools_dir/cargo-audit.tgz" --directory "$tools_dir"
          install -m 755 "$tools_dir/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" "$tools_dir/bin/cargo-audit"
          echo "$tools_dir/bin" >> "$GITHUB_PATH"
      - name: Test audit fail-closed policy
        run: node --test scripts/audit-dependencies.test.mjs
      - name: Audit production npm packages and Cargo.lock
        run: node scripts/audit-dependencies.mjs
      - name: Publish raw audits and policy result
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m11-dependency-audit
          path: coverage/audit/
          if-no-files-found: warn

  fuzz:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.extended-fuzz && 60 || 10 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies and build packages
        run: |
          npm install --global pnpm@10.18.3
          pnpm install --frozen-lockfile
          pnpm build
      - name: Reuse the verified SBF and IDL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: m1-step1-evidence
          path: .
      - name: Test fuzz evidence persistence and boundary accounting
        run: node --import tsx --test tests/fuzz/*.test.*
      - name: Property sequences on real SBF in LiteSVM
        timeout-minutes: ${{ inputs.extended-fuzz && 55 || 8 }}
        shell: bash
        env:
          EXTENDED_FUZZ: ${{ inputs.extended-fuzz }}
        run: |
          set -euo pipefail
          if [ "$EXTENDED_FUZZ" = "true" ]; then
            unset MULE_FUZZ_SEED
            export MULE_FUZZ_RUNS=512 MULE_FUZZ_STEPS=160
          else
            export MULE_FUZZ_SEED=20261007 MULE_FUZZ_RUNS=64 MULE_FUZZ_STEPS=80
          fi
          pnpm fuzz:program
      - name: Public seeds, statistics and minimized failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m11-fuzz-evidence
          path: coverage/fuzz/
          if-no-files-found: warn
