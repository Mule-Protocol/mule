name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10.18.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            ~/.local/share/solana/install
            target/debug
            target/release
            target/sbf-solana-solana
          key: mule-anchor0322-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'programs/*/Cargo.toml') }}
          restore-keys: mule-anchor0322-
      - name: Install pinned Anchor and Solana build tools
        run: |
          curl -fLsS https://github.com/otter-sec/anchor/releases/download/v0.32.2/anchor-0.32.2-x86_64-unknown-linux-gnu -o /tmp/anchor
          chmod +x /tmp/anchor
          sudo mv /tmp/anchor /usr/local/bin/anchor
          sh -c "$(curl -fLsS https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build Anchor program and IDL (no deployment)
        id: build
        run: |
          cargo fmt --all
          anchor --version
          solana --version
          anchor build --no-idl -- --tools-version v1.56
          mkdir -p target/idl
          anchor idl build --out target/idl/mule_escrow.json
      - name: Rust format and clippy
        run: |
          cargo fmt --all
          git diff --exit-code -- '*.rs'
          cargo clippy --workspace --all-targets -- -D warnings
      - name: SDK build, types, lint and tests
        if: success() || steps.build.outcome == 'success'
        run: |
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Anchor tests on the compiled SBF in LiteSVM
        if: success() || steps.build.outcome == 'success'
        run: anchor test --skip-build --skip-deploy --skip-local-validator
      - name: Instruction coverage
        if: always()
        run: pnpm coverage:instructions
      - name: Public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-step1-evidence
          path: |
            coverage/
            target/idl/mule_escrow.json
            target/deploy/mule_escrow.so
            Cargo.lock
            programs/mule_escrow/src/lib.rs
          if-no-files-found: warn
      - name: Cache compiler work without wallets
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            ~/.local/share/solana/install
            target/debug
            target/release
            target/sbf-solana-solana
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}